# Representative values for the standalone configuration parser tests.
[options]
update-check = disabled
upload-type = test
download-retry-time-seconds = 42
output-level = 4
save-download-history = false

[filter Current TV]
enabled = true
match-releases = Example.Show.*
min-size = 750MB
max-size = 4GB
seasons = 1-3
smart-episode = true
max-downloads = 2
max-downloads-per = day
upload-type = test

[server irc.example.org]
ssl = true
nick = autodl

[channel IRC.EXAMPLE.ORG]
name = #announce
password = secret
