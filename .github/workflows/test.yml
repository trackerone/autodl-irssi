name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  perl:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v5.0.0 (Node.js 24)
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ca-certificates cpanminus irssi libssl-dev \
            libio-socket-ssl-perl libnet-ssleay-perl libxml2-dev zlib1g-dev
      - name: Validate HTTPS support
        run: perl -MHTTP::Tiny -e 'my ($ok, $why) = HTTP::Tiny->can_ssl; die "$why\n" unless $ok; print "HTTPS support OK\n"'
      - name: Install Perl dependencies from cpanfile
        run: sudo cpanm --mirror https://cpan.metacpan.org --mirror-only --notest --installdeps .
      - name: Report versions
        run: |
          perl -V:version
          irssi --version
      - name: Run deterministic and Irssi lifecycle checks
        run: make syntax test test-irssi
      - name: Run HTTP 401 integration reproducer
        run: make test-http-401
      - name: Run HTTPS stall integration reproducer
        run: make test-https-stall
      - name: Run incomplete HTTP header integration reproducer
        run: make test-http-incomplete-header
      - name: Run tracker update installation characterization
        run: make test-tracker-update
      - name: Validate imported tracker definitions
        run: make test-trackers
      - name: Build development image
        run: docker build -t autodl-irssi-dev .
      - name: Run development image checks
        run: docker run --rm --network none autodl-irssi-dev
      - name: Validate workflow YAML
        run: ruby -e "require 'yaml'; YAML.load_file('.github/workflows/test.yml'); puts 'Workflow YAML is valid'"
